[project]
name = "bicot"
version = "0.1.0"
description = "Minimal reproduction of BiCoT: chain-of-thought geometry watermarking with sentinel-based black-box verification"
readme = "README.md"
requires-python = ">=3.9,<3.10"
dependencies = [
    "torch==2.8.0",
    "transformers==4.57.1",
    "peft==0.17.1",
    "datasets==3.6.0",
    "accelerate==1.10.1",
    "scikit-learn==1.6.1",
    "numpy==2.0.2",
    "tqdm==4.67.1",
    "fire==0.7.1",
]

[project.scripts]
bicot-train = "bicot.train:cli"
bicot-detect = "bicot.detect:main"

[dependency-groups]
dev = ["ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bicot"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
